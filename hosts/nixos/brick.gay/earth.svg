<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="sphere">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
    <style>
      @keyframes spin { 0% { transform: translateX(0); } 100% { transform: translateX(-112px); } }
      .globe { animation: spin 3s linear infinite; }
    </style>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#1a3366"/>
  <g clip-path="url(#sphere)" class="globe">
    <!-- First copy of continents -->
    <rect x="-10" y="12" width="22" height="16" fill="#2d8a4e" opacity="0.8" rx="5"/>
    <rect x="-30" y="8" width="18" height="12" fill="#2d8a4e" opacity="0.8" rx="4"/>
    <rect x="-50" y="20" width="25" height="28" fill="#2d8a4e" opacity="0.8" rx="7"/>
    <rect x="-70" y="8" width="18" height="15" fill="#2d8a4e" opacity="0.8" rx="5"/>
    <rect x="-90" y="18" width="20" height="20" fill="#2d8a4e" opacity="0.8" rx="6"/>
    <rect x="-110" y="8" width="18" height="14" fill="#2d8a4e" opacity="0.8" rx="4"/>
    <!-- Second copy (identical, for seamless loop) -->
    <rect x="102" y="12" width="22" height="16" fill="#2d8a4e" opacity="0.8" rx="5"/>
    <rect x="82" y="8" width="18" height="12" fill="#2d8a4e" opacity="0.8" rx="4"/>
    <rect x="62" y="20" width="25" height="28" fill="#2d8a4e" opacity="0.8" rx="7"/>
    <rect x="42" y="8" width="18" height="15" fill="#2d8a4e" opacity="0.8" rx="5"/>
    <rect x="22" y="18" width="20" height="20" fill="#2d8a4e" opacity="0.8" rx="6"/>
    <rect x="2" y="8" width="18" height="14" fill="#2d8a4e" opacity="0.8" rx="4"/>
  </g>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#4488FF" stroke-width="1.5"/>
  <ellipse cx="32" cy="32" rx="28" ry="7" fill="none" stroke="#4488FF" stroke-width="0.5" opacity="0.3"/>
</svg>