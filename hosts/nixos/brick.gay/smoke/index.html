*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#ccc;font-family:monospace;padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:#66FFFF;font-size:28px;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#666;font-size:12px;margin-bottom:24px}
.map-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.map-btn{background:#0a0a20;color:#ccc;border:1px solid #333;padding:10px 18px;cursor:pointer;font-family:monospace;font-size:14px;border-radius:3px}
.map-btn:hover{border-color:#66FFFF;color:#66FFFF}
.map-btn.active{border-color:#FF0099;color:#FF0099;background:#1a0a20}
.smoke-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.smoke-card{background:#0a0a20;border:1px solid #333;border-radius:4px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.smoke-card:hover{border-color:#FF0099}
.smoke-card .img{width:100%;aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;color:#444;font-size:12px;overflow:hidden}
.smoke-card .img img{width:100%;height:100%;object-fit:cover}
.smoke-card .info{padding:10px}
.smoke-card .info .name{color:#FFCC66;font-size:13px;font-weight:bold}
.smoke-card .info .desc{color:#888;font-size:11px;margin-top:4px}
.placeholder-img{width:100%;height:100%;background:linear-gradient(135deg,#0a0a20 0%,#1a1a40 50%,#0a0a20 100%);display:flex;align-items:center;justify-content:center;color:#555;font-size:13px;text-align:center;padding:20px}
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border:2px solid #333;border-radius:4px}
.lightbox .close{position:absolute;top:20px;right:30px;color:#FF0099;font-size:30px;cursor:pointer}
.lightbox .lb-info{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:#ccc;text-align:center;font-size:14px;background:rgba(0,0,0,0.8);padding:10px 20px;border-radius:4px}
</style>

const mapKeys=Object.keys(smokes);
let currentMap="dust2";

function renderMapButtons(){
  const g=document.getElementById("mapGrid");g.innerHTML="";
  for(const k of mapKeys){
    const btn=document.createElement("button");
    btn.className="map-btn"+(k===currentMap?" active":"");
    btn.textContent=smokes[k].name;
    btn.onclick=()=>{currentMap=k;renderMapButtons();renderSmokes();};
    g.appendChild(btn);
  }
}

async function renderSmokes(){
  const g=document.getElementById("smokeGrid");g.innerHTML="";
  const data=smokes[currentMap].lineups;
  for(let i=0;i<data.length;i++){
    const s=data[i];
    const card=document.createElement("div");card.className="smoke-card";
    const imgDiv=document.createElement("div");imgDiv.className="img";
    const im=document.createElement("img");
    im.style.width="100%";im.style.height="100%";im.style.objectFit="cover";
    im.src=svgData[currentMap+"_"+(i+1)];
    im.onerror=function(){this.style.display="none";this.parentNode.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#555;font-size:12px">LOAD ERROR</div>';};
    im.alt=s.name;
    imgDiv.appendChild(im);
    imgDiv.onclick=()=>openLightbox(i);
    const info=document.createElement("div");info.className="info";
    info.innerHTML='<div class="name">'+s.name+'</div><div class="desc">'+s.desc+'</div>';
    card.appendChild(imgDiv);card.appendChild(info);
    g.appendChild(card);
  }
}

function openLightbox(idx){
  const s=smokes[currentMap].lineups[idx];
  document.getElementById("lbImg").src=svgData[currentMap+"_"+(idx+1)];
  document.getElementById("lbInfo").textContent=s.name+" - "+s.desc;
  document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){document.getElementById("lightbox").classList.remove("open");}
renderMapButtons();renderSmokes();
</script>
</body>
