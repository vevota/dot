<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="description" content="CS2 nade lineups">
<title>NADES.BRICK.GAY</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#ccc;font-family:monospace;padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:#66FFFF;font-size:28px;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#666;font-size:12px;margin-bottom:24px}
.map-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.map-btn{background:#0a0a20;color:#ccc;border:1px solid #333;padding:10px 18px;cursor:pointer;font-family:monospace;font-size:14px;border-radius:3px}
.map-btn:hover{border-color:#66FFFF;color:#66FFFF}
.map-btn.active{border-color:#FF0099;color:#FF0099;background:#1a0a20}
.nade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.nade-card{background:#0a0a20;border:1px solid #333;border-radius:4px;overflow:hidden}
.nade-card .media{width:100%;aspect-ratio:16/9;background:#111;position:relative;overflow:hidden;cursor:pointer}
.nade-card .media img{width:100%;height:100%;object-fit:cover}
.nade-card .media video{width:100%;height:100%;object-fit:cover;display:none}
.nade-card .media .play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:rgba(255,0,153,0.8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;cursor:pointer;z-index:2}
.nade-card .info{padding:10px}
.nade-card .info .from{color:#FFCC66;font-size:13px;font-weight:bold}
.nade-card .info .to{color:#66FFFF;font-size:12px}
.nade-card .info .arrow{color:#888;font-size:12px;margin:2px 0}
</style>
</head>
<body>
<div class="container">
<h1>STAR CS2 NADES STAR</h1>
<p class="subtitle">Click a map, then click a nade to see the video</p>
<div class="map-grid" id="mapGrid"></div>
<div class="nade-grid" id="nadeGrid"></div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;justify-content:center;align-items:center;cursor:pointer">
<video id="lbVideo" style="max-width:90vw;max-height:85vh" controls autoplay playsinline></video>
</div>
<script>
const nadeData={"mirage":[{"id":"EHvVQ0Ebqm","from":"?","to":"?"},{"id":"wsMc7skGQh","from":"?","to":"?"},{"id":"h4RLQbKgkO","from":"?","to":"?"},{"id":"I60PpERA4N","from":"?","to":"?"},{"id":"6UrrcOsJSD","from":"?","to":"?"},{"id":"5NzRMI354j","from":"?","to":"?"},{"id":"UJiXtqvbkb","from":"?","to":"?"}],"dust2":[{"id":"epau9Q3Dll","from":"?","to":"?"},{"id":"MrTSxptCeA","from":"?","to":"?"},{"id":"HupX3P0FUE","from":"?","to":"?"},{"id":"QUSiBuN0RC","from":"?","to":"?"},{"id":"dBt2lcA3vc","from":"?","to":"?"},{"id":"KuDym6tvW2","from":"?","to":"?"},{"id":"pXWCQLmYhk","from":"?","to":"?"}],"inferno":[{"id":"MrAFqNRIOT","from":"?","to":"?"},{"id":"Fomlq5TPso","from":"?","to":"?"},{"id":"oDxbaepICU","from":"?","to":"?"},{"id":"9LzHE8aRot","from":"?","to":"?"},{"id":"a2ITuReCiS","from":"?","to":"?"},{"id":"xWSXzEwtxB","from":"?","to":"?"},{"id":"qNO7ZhaDsF","from":"?","to":"?"}],"nuke":[{"id":"Ox2V20EXl2","from":"?","to":"?"},{"id":"Sswwq7kpV9","from":"?","to":"?"},{"id":"faS2qYaA3o","from":"?","to":"?"},{"id":"EsLX408n4d","from":"?","to":"?"},{"id":"l3koCgeoHZ","from":"?","to":"?"},{"id":"6T37K29Fos","from":"?","to":"?"},{"id":"Q9fOLapNdW","from":"?","to":"?"}],"ancient":[{"id":"mhHNTLDnNw","from":"?","to":"?"},{"id":"05JJVnP8AP","from":"?","to":"?"},{"id":"T3Mseb88b9","from":"?","to":"?"},{"id":"0JpsvFLFbE","from":"?","to":"?"},{"id":"jRgHHBZPeJ","from":"?","to":"?"},{"id":"SHv86icIFy","from":"?","to":"?"},{"id":"nQ0TRW2zEy","from":"?","to":"?"}],"anubis":[{"id":"RPRA6boGge","from":"?","to":"?"},{"id":"kmlXeKSDJM","from":"?","to":"?"},{"id":"0MzIjwXEIJ","from":"?","to":"?"},{"id":"ZQ0D2bZhk7","from":"?","to":"?"},{"id":"JbhR4dxPHd","from":"?","to":"?"},{"id":"aQBt4qCxLI","from":"?","to":"?"},{"id":"Qoj34RwWIE","from":"?","to":"?"}],"vertigo":[{"id":"kLpQfwtnrZ","from":"?","to":"?"},{"id":"LZ7w8nAhRU","from":"?","to":"?"},{"id":"u2AcCDRYoM","from":"?","to":"?"},{"id":"T7wlpObMtB","from":"?","to":"?"},{"id":"qMX7mv9E5v","from":"?","to":"?"},{"id":"cOpgHeMF27","from":"?","to":"?"},{"id":"ynNaNJ7Ga9","from":"?","to":"?"}]};
const mapLabels={"mirage":"Mirage","dust2":"Dust II","inferno":"Inferno","nuke":"Nuke","ancient":"Ancient","anubis":"Anubis","vertigo":"Vertigo"};
const mapKeys=Object.keys(nadeData);
let currentMap="mirage";

function renderMapButtons(){
  const g=document.getElementById("mapGrid");g.innerHTML="";
  for(const k of mapKeys){
    const btn=document.createElement("button");
    btn.className="map-btn"+(k===currentMap?" active":"");
    btn.textContent=mapLabels[k]||k;
    btn.onclick=()=>{currentMap=k;renderMapButtons();renderNades();};
    g.appendChild(btn);
  }
}

function renderNades(){
  const g=document.getElementById("nadeGrid");g.innerHTML="";
  const data=nadeData[currentMap];
  for(let i=0;i<data.length;i++){
    const n=data[i];
    const card=document.createElement("div");card.className="nade-card";
    const media=document.createElement("div");media.className="media";
    const img=document.createElement("img");img.loading="lazy";
    img.src="https://assets.csnades.gg/nades/"+currentMap+"-smoke-"+n.id+"/lineup.webp";img.alt=n.from+" -> "+n.to;
    const pb=document.createElement("div");pb.className="play-btn";pb.textContent="\u25B6";
    const vid=document.createElement("video");
    vid.src="https://assets.csnades.gg/nades/"+currentMap+"-smoke-"+n.id+"/thumbnail.mp4";
    vid.muted=true;vid.loop=true;vid.playsinline=true;
    pb.onclick=function(e){e.stopPropagation();img.style.display="none";pb.style.display="none";vid.style.display="block";vid.play();};
    media.appendChild(img);media.appendChild(pb);media.appendChild(vid);
    media.onclick=function(){openLightbox(n.id,currentMap);};
    const info=document.createElement("div");info.className="info";
    info.innerHTML='<div class="from">'+n.from+'</div><div class="arrow">\u2193 THROW FROM</div><div class="to">\u2192 '+n.to+'</div>';
    card.appendChild(media);card.appendChild(info);
    g.appendChild(card);
  }
}

function openLightbox(id,map){
  document.getElementById("lbVideo").src="https://assets.csnades.gg/nades/"+map+"-smoke-"+id+"/hq.mp4";
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lbVideo").play();
}
function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
  document.getElementById("lbVideo").pause();
}
renderMapButtons();renderNades();
</script>
</body>
</html>
