const mapLabels={"mirage":"Mirage","dust2":"Dust II","inferno":"Inferno","nuke":"Nuke","ancient":"Ancient","anubis":"Anubis","vertigo":"Vertigo","overpass":"Overpass","train":"Train","cache":"Cache","thera":"Thera","mills":"Mills"};
const mapKeys=Object.keys(nadeData);
let currentMap="mirage";
let currentTeam="all";

function setTeam(t){
  currentTeam=t;
  document.querySelectorAll(".team-btn").forEach(b=>{
    b.className="team-btn";
    if(b.dataset.team===t) b.className+=" active-"+t;
  });
  renderNades();
}

function renderMapButtons(){
  const g=document.getElementById("mapGrid");g.innerHTML="";
  for(const k of mapKeys){
    const btn=document.createElement("button");
    btn.className="map-btn"+(k===currentMap?" active":"");
    btn.textContent=mapLabels[k]||k;
    btn.onclick=()=>{currentMap=k;renderMapButtons();renderNades();};
    g.appendChild(btn);
  }
}

function renderNades(){
  const g=document.getElementById("nadeGrid");g.innerHTML="";
  let data=nadeData[currentMap];
  if(currentTeam!=="all") data=data.filter(n=>n.team===currentTeam||n.team==="any");
  for(let i=0;i<data.length;i++){
    const n=data[i];
    const rank=i+1;
    const card=document.createElement("div");card.className="nade-card";
    const rbar=document.createElement("div");rbar.className="rank "+(n.team||"any")+(rank==1?" num1":"");
    const teamLabel=n.team==="t"?"T":n.team==="ct"?"CT":"ANY";
    rbar.textContent="#"+rank+"  "+teamLabel;
    const media=document.createElement("div");media.className="media";
    const img=document.createElement("img");img.loading="lazy";
    img.src="https://assets.csnades.gg/nades/"+currentMap+"-smoke-"+n.id+"/lineup.webp";
    img.alt=n.to;
    const pb=document.createElement("div");pb.className="play-btn";pb.textContent="\u25B6";
    const vid=document.createElement("video");
    vid.src="https://assets.csnades.gg/nades/"+currentMap+"-smoke-"+n.id+"/thumbnail.mp4";
    vid.muted=true;vid.loop=true;vid.playsinline=true;
    pb.onclick=function(e){e.stopPropagation();img.style.display="none";pb.style.display="none";vid.style.display="block";vid.play();};
    media.appendChild(img);media.appendChild(pb);media.appendChild(vid);
    media.onclick=function(){openLightbox(n.id,currentMap);};
    const info=document.createElement("div");info.className="info";
    info.innerHTML='<div class="to">'+n.to+'</div><div class="label">FROM</div><div class="from">'+n.from+'</div><div class="desc">'+n.desc+'</div>';
    card.appendChild(rbar);card.appendChild(media);card.appendChild(info);
    g.appendChild(card);
  }
}

function openLightbox(id,m){
  document.getElementById("lbVideo").src="https://assets.csnades.gg/nades/"+m+"-smoke-"+id+"/hq.mp4";
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lbVideo").play();
}
function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
  document.getElementById("lbVideo").pause();
}
renderMapButtons();setTeam("all");
</script>
